<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#438f8a">
<title>Still Water</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #438f8a; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  header { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  h1 { margin: 0; font: 400 clamp(52px, 9vw, 120px)/1.1 Georgia, serif; letter-spacing: -.045em; text-shadow: 0 2px 30px #235e6640; }
  footer { position: fixed; bottom: max(32px, env(safe-area-inset-bottom)); left: 20px; right: 20px; text-align: center; font: 10px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; pointer-events: none; }
  #error { display: none; position: fixed; top: 65%; left: 24px; right: 24px; text-align: center; font: 14px/1.6 system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="water" aria-label="An animated blue-green pond seen from above. Click or tap to make ripples."></canvas>
<header><h1>Still Water</h1></header>
<footer>Touch the water · Stay a while</footer>
<p id="error" role="alert">WebGL is unavailable. Please use a browser with WebGL enabled to see the pond.</p>
<script>
'use strict';
const canvas = document.getElementById('water');
const errorMessage = document.getElementById('error');
const vertexSource = `
attribute vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }
`;
const fragmentSource = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 resolution;
uniform float time;
uniform vec2 mouse;
uniform float mouseActivity;
uniform vec3 ripples[10]; // Aspect-corrected x, y and start time.
uniform float rippleGain[10];

// Noise: hash randomness, interpolated value noise and four-octave fBm.
float hash(vec2 p) {
  p = fract(p * vec2(123.34, 345.45));
  p += dot(p, p + 34.345);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + 1.0), u.x), u.y);
}
float fbm(vec2 p) {
  float value = 0.0, amplitude = 0.53;
  for (int i = 0; i < 4; i++) {
    value += amplitude * noise(p);
    p = mat2(0.8, -0.6, 0.6, 0.8) * p * 2.03 + 7.1;
    amplitude *= 0.5;
  }
  return value;
}
mat2 rotate(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

void main() {
  vec2 uv = gl_FragCoord.xy / resolution;
  float shortSide = min(resolution.x, resolution.y);
  float pixel = 1.0 / shortSide; // Screen-space AA, without derivative extensions.
  vec2 p = (gl_FragCoord.xy - 0.5 * resolution) / shortSide;

  // Ripples: smoothly born, expanding wave packets with a five-second lifespan.
  vec2 displacement = vec2(0.0);
  float ringLight = 0.0;
  for (int i = 0; i < 10; i++) {
    float age = time - ripples[i].z;
    if (age >= 0.0 && age < 5.0) {
      vec2 delta = p - ripples[i].xy;
      float distance = length(delta);
      float front = distance - age * 0.125;
      float envelope = exp(-pow(front / 0.055, 2.0));
      envelope *= smoothstep(0.0, 0.25, age) * (1.0 - smoothstep(0.7, 5.0, age));
      envelope *= rippleGain[i];
      float wave = sin(front * 145.0);
      displacement += delta / max(distance, pixel) * wave * envelope * 0.012;
      float ring = 1.0 - smoothstep(0.001, 0.001 + pixel * 1.5, abs(wave) / 145.0);
      ringLight += (ring * 0.075 - wave * 0.021) * envelope;
    }
  }
  vec2 delta = p - mouse;
  float distance = length(delta);
  float wobble = sin(distance * 65.0 - time * 2.0) * exp(-distance * distance * 90.0);
  displacement += delta / max(distance, pixel) * wobble * mouseActivity * 0.003;

  // Water: blue-green depth, light domain warping and a quiet web of caustics.
  vec2 drift = vec2(time * 0.008, -time * 0.005);
  vec2 warp = vec2(fbm(p * 2.0 + drift), fbm(p * 2.0 - drift + 8.2)) - 0.5;
  vec2 q = p + warp * 0.055 + displacement;
  float depth = fbm(q * 2.0 + drift);
  vec3 color = mix(vec3(0.19, 0.51, 0.53), vec3(0.36, 0.70, 0.62), depth);
  vec2 c = q * 19.0;
  float a = sin(c.x + sin(c.y * 0.72 + time * 0.14) * 1.3 + time * 0.12);
  float b = sin(c.y + sin(c.x * 0.67 - time * 0.11) * 1.2 - time * 0.10);
  float caustic = 1.0 - smoothstep(0.025, 0.11 + pixel * 24.0, abs(a + b));
  color += vec3(0.12, 0.17, 0.10) * caustic * 0.28;

  // Reflections: broad milky clouds move very slowly across the surface.
  float cloudNoise = fbm(q * 2.4 + vec2(time * 0.006 + 3.7, time * 0.003 + 8.2));
  float clouds = smoothstep(0.39, 0.70, cloudNoise);
  color = mix(color, vec3(0.83, 0.91, 0.84), clouds * 0.56);
  color += vec3(0.68, 0.85, 0.79) * ringLight;

  // Leaves: individually paced drift, soft shadows, pointed silhouettes and veins.
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    vec2 seed = vec2(fi + 4.0, fi * 2.0 + 8.0);
    float speed = 0.014 + hash(seed + 3.0) * 0.025;
    vec2 location = vec2(0.08 + 0.84 * hash(seed), 0.09 + 0.82 * hash(seed + 12.0));
    location += vec2(sin(time * speed + fi * 2.1), cos(time * speed * 0.8 + fi)) * 0.023;
    vec2 leaf = (uv - location) * resolution / shortSide;
    leaf = rotate(fi * 2.4 + sin(time * speed + fi) * 0.18) * leaf;
    float size = 0.012 + hash(seed + 6.0) * 0.005;
    vec2 shadow = (leaf - vec2(0.004, -0.005)) / vec2(size, size * 0.43);
    color *= 1.0 - exp(-dot(shadow, shadow) * 1.5) * 0.13;
    vec2 l = leaf / vec2(size, size * 0.43);
    float shape = (abs(l.y) + pow(abs(l.x), 1.6) - 1.0) * size * 0.43;
    float mask = 1.0 - smoothstep(-pixel, pixel, shape);
    vec3 leafColor = mix(vec3(0.48, 0.57, 0.25), vec3(0.78, 0.69, 0.37), hash(seed + 9.0));
    leafColor += vec3(0.09, 0.08, 0.025) * smoothstep(-0.15, 0.4, l.y);
    color = mix(color, leafColor, mask);
    float vein = (1.0 - smoothstep(0.0002, 0.0002 + pixel, abs(leaf.y)))
               * (1.0 - smoothstep(0.65, 0.9, abs(l.x)));
    color = mix(color, vec3(0.89, 0.83, 0.50), vein * mask * 0.45);
  }

  // Compositing: softly darkened edges finish the illustrated poster.
  float edge = smoothstep(0.20, 0.71, length(uv - 0.5));
  color *= 1.0 - edge * 0.20;
  gl_FragColor = vec4(color, 1.0);
}
`;

try {
  const gl = canvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'low-power' });
  if (!gl) throw new Error('WebGL unavailable');
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const uniforms = {};
  for (const name of ['resolution', 'time', 'mouse', 'mouseActivity', 'ripples[0]', 'rippleGain[0]']) {
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  const ripples = new Float32Array(30);
  const gains = new Float32Array(10).fill(1);
  const pending = Array(10).fill(null);
  const retireAt = new Float64Array(10).fill(-1);
  for (let i = 0; i < 10; i++) ripples[i * 3 + 2] = -10;
  let time = 0, last = performance.now(), next = 0, frame;
  let mouse = [0, 0], activity = 0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(innerWidth * dpr));
    canvas.height = Math.max(1, Math.round(innerHeight * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  function coordinates(event) {
    const r = canvas.getBoundingClientRect();
    const scale = Math.min(r.width, r.height);
    return [(event.clientX - r.left - r.width * 0.5) / scale,
            (r.height * 0.5 - event.clientY + r.top) / scale];
  }
  canvas.addEventListener('pointerdown', event => {
    const point = coordinates(event);
    // Never overwrite a visible wave. At capacity, retire the selected wave over
    // 220ms before starting its replacement. Further bursts coalesce per slot.
    if (time - ripples[next * 3 + 2] >= 5 && !pending[next]) {
      ripples.set([...point, time], next * 3);
      gains[next] = 1;
    } else {
      pending[next] = point;
      if (retireAt[next] < 0) retireAt[next] = time;
    }
    next = (next + 1) % 10;
  });
  canvas.addEventListener('pointermove', event => {
    const point = coordinates(event);
    const travel = Math.hypot(point[0] - mouse[0], point[1] - mouse[1]);
    mouse = point;
    activity = Math.min(1, activity + travel * 8);
  });
  canvas.addEventListener('pointerleave', () => { activity *= 0.5; });

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!document.hidden) {
      time += dt;
      activity *= Math.exp(-dt * 2.5);
      for (let i = 0; i < 10; i++) {
        if (!pending[i]) continue;
        const fade = Math.min(1, (time - retireAt[i]) / 0.22);
        gains[i] = 1 - fade * fade * (3 - 2 * fade);
        if (fade >= 1) {
          ripples.set([...pending[i], time], i * 3);
          pending[i] = null;
          retireAt[i] = -1;
          gains[i] = 1; // New wave starts at zero amplitude in the shader.
        }
      }
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform1f(uniforms.time, time);
      gl.uniform2f(uniforms.mouse, mouse[0], mouse[1]);
      gl.uniform1f(uniforms.mouseActivity, activity);
      gl.uniform3fv(uniforms['ripples[0]'], ripples);
      gl.uniform1fv(uniforms['rippleGain[0]'], gains);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    frame = requestAnimationFrame(tick);
  }
  addEventListener('resize', resize);
  canvas.addEventListener('webglcontextlost', event => {
    event.preventDefault();
    cancelAnimationFrame(frame);
    errorMessage.textContent = 'The WebGL connection was lost. Reload to return to the pond.';
    errorMessage.style.display = 'block';
  });
  resize();
  frame = requestAnimationFrame(tick);
} catch (error) {
  errorMessage.style.display = 'block';
  console.error(error);
}
</script>
</body>
</html>
